<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTC Content Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&family=Oswald:wght@600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1d242a; --panel:#27313a; --panel2:#2f3a44; --text:#eef1f3; --muted:#9aa7b1;
  --line:#f2c230; --accent:#0a4da2; --accent2:#0e6b45; --danger:#c94b4b; --border:rgba(255,255,255,.14);
  --radius:10px; --gap:.8rem; --pad:1rem; --font-body:'Inter',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-head:'Barlow Condensed','Inter',sans-serif; --shell:1180px;
}
*{box-sizing:border-box}
html,body{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--asphalt);color:var(--text);font:15px/1.55 var(--font-body)}
h1,h2,h3{margin:0;font-weight:800;font-family:var(--font-head);letter-spacing:.01em}
a{color:var(--accent)}
.shell{max-width:var(--shell);margin:0 auto;padding:1.25rem 1.25rem 4rem}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0 1.1rem;border-bottom:5px dashed var(--line);margin-bottom:1.4rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem}
.brand .mark{width:36px;height:36px;border-radius:calc(var(--radius) - 2px);background:var(--accent);border:2px solid #fff;outline:2px solid var(--accent);flex:none}
.brand h1{font-size:1.45rem;text-transform:uppercase}
.brand p{margin:.1rem 0 0;color:var(--muted);font-size:.82rem;font-family:var(--font-body)}
.headtools{display:flex;gap:.45rem;align-items:center}
.layout{display:grid;grid-template-columns:200px 1fr;gap:1.4rem;align-items:start}
body.layout-top .layout{grid-template-columns:1fr}
nav.side{display:flex;flex-direction:column;gap:.35rem;position:sticky;top:1rem}
body.layout-top nav.side{flex-direction:row;flex-wrap:wrap;position:static}
.tab{text-align:left;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:.55rem .85rem;border-radius:calc(var(--radius) - 3px);font-weight:700;font-size:.86rem;cursor:pointer;font-family:var(--font-body)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
section.pane{display:none} section.pane.active{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad) calc(var(--pad) + .1rem);margin-bottom:var(--gap)}
.card h3{font-size:1.05rem;margin-bottom:.15rem}
.muted{color:var(--muted)}
.field{margin-bottom:.6rem}
.field label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:calc(var(--radius) - 4px);padding:.5rem .6rem;font:inherit}
.field textarea{min-height:4.2em;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.field input[type=color]{width:100%;height:38px;background:var(--panel2);border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:2px;cursor:pointer}
.field input[type=range]{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media (max-width:760px){ .layout{grid-template-columns:1fr} nav.side{flex-direction:row;flex-wrap:wrap} .row2,.row3{grid-template-columns:1fr} }
.check{display:flex;align-items:center;gap:.5rem}
.check input{width:auto}
.check label{margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:600;color:var(--text)}
.item-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.5rem}
button{font:inherit;font-family:var(--font-body);cursor:pointer;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:.45rem .8rem;font-weight:700;font-size:.82rem}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.add{background:var(--accent2);border-color:var(--accent2);color:#fff;margin-bottom:1rem}
button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
button.tiny{padding:.25rem .5rem;font-size:.75rem}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{border:2px dashed var(--border);border-radius:var(--radius);padding:1.4rem;color:var(--muted);text-align:center}
pre{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;overflow:auto;font-size:.78rem;max-height:60vh}
.savebar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);padding:.6rem .9rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.82rem;color:var(--muted);margin-top:1rem}
.gate{max-width:380px;margin:4rem auto;background:var(--panel);border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);padding:1.6rem}
.gate h2{margin-bottom:.3rem}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-top:.4rem}
.dropzone{border:2px dashed var(--border);border-radius:calc(var(--radius) - 2px);padding:.8rem;text-align:center;color:var(--muted);font-size:.8rem;cursor:pointer;background:var(--panel2)}
.dropzone.over{border-color:var(--accent);color:var(--text)}
.thumb{display:flex;gap:.6rem;align-items:center;margin-top:.5rem}
.thumb img{width:74px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:var(--panel2)}
.imgwrap{grid-column:1 / -1}
.swatchrow{display:flex;gap:.4rem;flex-wrap:wrap}
.preset{border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:.45rem .7rem;font-weight:700;font-size:.8rem;display:flex;align-items:center;gap:.4rem}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.orderlist{display:flex;flex-direction:column;gap:.35rem}
.orderitem{display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:var(--panel2);border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:.4rem .6rem;font-size:.85rem;font-weight:600}
.previewbox{border:1px solid var(--border);border-radius:var(--radius);padding:1rem;background:var(--panel2)}
.previewbox .pbtn{display:inline-block;background:var(--accent);color:#fff;border-radius:calc(var(--radius) - 4px);padding:.4rem .8rem;font-weight:700;font-size:.8rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem}
.gal figure{margin:0}
.gal img{width:100%;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
[hidden]{display:none!important}
.toasts{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:50}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:8px;padding:.6rem .9rem;font-size:.85rem;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:320px}
.toast.err{border-left-color:var(--danger)}
.pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:.4rem}
.pill.draft{background:var(--line);color:#1d1d1d}.pill.live{background:var(--accent2);color:#fff}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;max-width:400px;width:92%}
.modal p{margin:.5rem 0 1rem}.modal .item-actions{margin:0}

/* ---------- Blogger-style layout editor ---------- */
.lx-pages{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.lx-pages .tab.active{background:var(--accent)}
.lx-grid{display:grid;grid-template-columns:30% 1fr;gap:.9rem;align-items:start;padding-bottom:5rem}
.lx-col{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.lx-region{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:.55rem}
.lx-region>h4{margin:0 0 .5rem .15rem;font:700 .8rem var(--font-body);color:var(--muted)}
.lx-zone{display:flex;flex-direction:column;gap:.4rem;min-height:2.6rem;border-radius:calc(var(--radius) - 3px);padding:.1rem;position:relative}
.lx-zone.over{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px dashed var(--accent);outline-offset:2px}
.lx-add{width:100%;border:2px dashed var(--border);background:transparent;color:var(--muted);padding:.5rem;font-weight:600}
.lx-add:hover{border-color:var(--accent);color:var(--text);filter:none}
.lx-gadget{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:.55rem;background:var(--panel2);border:1px solid var(--border);border-radius:calc(var(--radius) - 3px);padding:.5rem .55rem;cursor:grab}
.lx-gadget.dragging{opacity:.35}
.lx-gadget.off .lx-t{opacity:.55}
.lx-gadget.off .lx-eye{color:var(--muted)}
.lx-grip{width:10px;height:18px;color:var(--muted);flex:none}
.lx-eye,.lx-edit{background:none;border:0;padding:.3rem;color:var(--text);display:grid;place-items:center;border-radius:6px}
.lx-eye svg,.lx-edit svg,.lx-bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lx-edit:hover,.lx-eye:hover{background:var(--panel);filter:none}
.lx-t{min-width:0}.lx-t b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-t small{display:block;color:var(--muted);font-size:.75rem}
.lx-gadget.pinned{cursor:default;border-style:dashed}
.lx-drop-line{height:3px;border-radius:2px;background:var(--line);margin:-.2rem 0}
.lx-bar{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:.35rem;padding:.4rem;background:var(--panel);border:1px solid var(--border);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:40}
.lx-bar button{display:flex;align-items:center;gap:.4rem;border-radius:999px;padding:.55rem 1rem}
.lx-bar .primary{background:var(--accent2);border-color:var(--accent2)}
.lx-preview .lx-grip,.lx-preview .lx-add,.lx-preview .lx-edit,.lx-preview .lx-eye,.lx-preview .lx-region>h4{display:none}
.lx-preview .lx-gadget{grid-template-columns:1fr;cursor:default}
.lx-preview .lx-gadget.off{display:none}
.lx-preview .lx-zone{pointer-events:none;min-height:0}
.lx-preview .lx-region{border-style:dashed}
@media (max-width:760px){.lx-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h2>GTC Content Desk</h2>
  <p class="muted">Sign in with the admin account to edit the site.</p>
  <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
  <div class="field"><label>Password</label><input type="password" id="loginPass"></div>
  <button class="primary" id="loginBtn" style="width:100%">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="shell" id="app" hidden>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div><h1 id="brandName">GTC Content Desk</h1><p id="connNote" class="muted">Connecting…</p></div>
    </div>
    <div class="headtools">
      <button id="modeBtn" title="Switch light / dark">Dark / light</button>
      <button id="discardBtn" class="danger" disabled>Discard changes</button>
      <button id="publishBtn" class="primary" disabled>Publish</button>
      <button id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" id="tabs"></nav>
    <div>
      <section class="pane" data-pane="links"><div id="paneLinks"></div></section>
      <section class="pane" data-pane="pages"><div id="panePages"></div></section>
      <section class="pane" data-pane="design"><div id="paneDesign"></div></section>
      <section class="pane" data-pane="news"><div id="paneNews"></div></section>
      <section class="pane" data-pane="team"><div id="paneTeam"></div></section>
      <section class="pane" data-pane="streamers"><div id="paneStreamers"></div></section>
      <section class="pane" data-pane="gallery"><div id="paneGallery"></div></section>
      <section class="pane" data-pane="media"><div id="paneMedia"></div></section>
      <section class="pane" data-pane="planner"><div id="panePlanner"></div></section>
      <section class="pane" data-pane="backup"><div id="paneBackup"></div></section>
      <div class="savebar"><span id="saveStatus">—</span><span class="muted" id="themeNote"></span></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script>
/* ---------- content backend (your existing site database) ---------- */
const SUPABASE_URL = "https://atmoshbogjqifmnurdni.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4eh56UPX1w50-hyFmDVcJA_Gjz5uflE";

/* ---------- image storage backend (Lovable Cloud) ---------- */
const STORAGE_URL = "https://bissmepkqhackzaezvax.supabase.co";
const STORAGE_KEY = "sb_publishable_a37psIhYy7hU9xY460QHLQ_JZGpv6vE";
const STORAGE_BUCKET = "site-images";
const SIGNED_TTL = 60 * 60 * 24 * 365 * 10; // 10 years
/* ------------------------------------------------------------------ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const store = supabase.createClient(STORAGE_URL, STORAGE_KEY, { auth: { persistSession: false } });

let data = null;
let saving = false, saveTimer = null;

/* ---------- theme defaults ---------- */
const THEME_DEFAULTS = {
  mode: "dark",
  bg: "#1d242a", panel: "#27313a", panel2: "#2f3a44",
  text: "#eef1f3", muted: "#9aa7b1",
  accent: "#0a4da2", accent2: "#0e6b45", line: "#f2c230",
  headingFont: "Barlow Condensed", bodyFont: "Inter",
  radius: 10, density: "comfortable", width: 1180,
  navLayout: "side",
  sections: ["hero","news","convoys","team","streamers","gallery","join"],
  logo: "", hero: ""
};
const PRESETS = {
  "Asphalt (default)": {mode:"dark",bg:"#1d242a",panel:"#27313a",panel2:"#2f3a44",text:"#eef1f3",muted:"#9aa7b1",accent:"#0a4da2",accent2:"#0e6b45",line:"#f2c230"},
  "Night highway":     {mode:"dark",bg:"#11131a",panel:"#1a1d27",panel2:"#232733",text:"#f2f4f8",muted:"#9ba3b4",accent:"#3d7dff",accent2:"#27a37a",line:"#ffb020"},
  "Paper daylight":    {mode:"light",bg:"#eef0f2",panel:"#ffffff",panel2:"#f4f6f8",text:"#151b21",muted:"#5b6672",accent:"#12508f",accent2:"#0d6b47",line:"#e0a91b"},
  "Diesel red":        {mode:"dark",bg:"#1a1516",panel:"#241c1e",panel2:"#2e2427",text:"#f6eeee",muted:"#b09a9c",accent:"#c03a3a",accent2:"#8a6a1f",line:"#f0c05a"},
  "Forest freight":    {mode:"dark",bg:"#131a17",panel:"#1c2621",panel2:"#24302a",text:"#eef4f0",muted:"#9bb0a5",accent:"#1f7a54",accent2:"#2f6d8f",line:"#d8c257"}
};
const FONTS = ["Inter","Manrope","Barlow Condensed","Oswald","Space Grotesk","system-ui"];
const SECTION_LABELS = {hero:"Hero banner",news:"News & blog",convoys:"Convoy planner",team:"Team",streamers:"Streamers",gallery:"Gallery",join:"Join us / links"};
const DENSITY = {compact:{gap:".5rem",pad:".7rem"},comfortable:{gap:".8rem",pad:"1rem"},roomy:{gap:"1.2rem",pad:"1.4rem"}};

/* ---------- tiny helpers ---------- */
function status(msg,isErr){const s=document.getElementById("saveStatus");s.textContent=msg;s.style.color=isErr?"var(--danger)":"";}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function field(labelText,input){const f=el("div","field");f.append(el("label","",labelText),input);return f;}
function textInput(val,ph){const i=document.createElement("input");i.type="text";i.value=val||"";if(ph)i.placeholder=ph;return i;}
function textArea(val,ph){const t=document.createElement("textarea");t.value=val||"";if(ph)t.placeholder=ph;return t;}
function colorInput(val){const i=document.createElement("input");i.type="color";i.value=val||"#000000";return i;}
function selectInput(options,val){const s=document.createElement("select");options.forEach(o=>{const op=document.createElement("option");const[v,l]=Array.isArray(o)?o:[o,o];op.value=v;op.textContent=l;if(v===val)op.selected=true;s.append(op);});return s;}

/* ---------- theme ---------- */
function theme(){ if(!data.theme) data.theme={}; for(const k in THEME_DEFAULTS){ if(data.theme[k]===undefined) data.theme[k]=Array.isArray(THEME_DEFAULTS[k])?THEME_DEFAULTS[k].slice():THEME_DEFAULTS[k]; } return data.theme; }
function applyTheme(){
  const t=theme(), r=document.documentElement.style;
  r.setProperty("--asphalt",t.bg); r.setProperty("--panel",t.panel); r.setProperty("--panel2",t.panel2);
  r.setProperty("--text",t.text); r.setProperty("--muted",t.muted);
  r.setProperty("--accent",t.accent); r.setProperty("--accent2",t.accent2); r.setProperty("--line",t.line);
  r.setProperty("--radius",t.radius+"px"); r.setProperty("--shell",t.width+"px");
  r.setProperty("--font-head","'"+t.headingFont+"',sans-serif");
  r.setProperty("--font-body","'"+t.bodyFont+"',sans-serif");
  const d=DENSITY[t.density]||DENSITY.comfortable; r.setProperty("--gap",d.gap); r.setProperty("--pad",d.pad);
  document.body.classList.toggle("layout-top",t.navLayout==="top");
  document.getElementById("brandName").textContent=(data.name||"GTC")+" Content Desk";
  document.getElementById("themeNote").textContent="Theme: "+t.mode+" · "+t.headingFont;
}

/* ---------- auth ---------- */
document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPass").value;
  const errEl=document.getElementById("loginErr"); errEl.textContent="";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){errEl.textContent=error.message;return;}
  boot();
});
document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  if(dirty&&!await confirmBox("Sign out?","You have unpublished changes. They stay saved on this device.","Sign out"))return;
  await sb.auth.signOut();
  document.getElementById("app").hidden=true;
  document.getElementById("gate").hidden=false;
});
document.getElementById("modeBtn").addEventListener("click", ()=>{
  const t=theme();
  const target=t.mode==="dark"?"Paper daylight":"Asphalt (default)";
  Object.assign(t,PRESETS[target]);
  applyTheme(); renderDesign(); save();
});

sb.auth.getSession().then(({data:d})=>{if(d.session)boot();});
document.getElementById("loginPass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click();});
async function boot(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  await loadData();
}

async function loadData(){
  status("Loading content…");
  const {data:row,error}=await sb.from("site_content").select("data").eq("id",1).single();
  if(error){status("Couldn't load content: "+error.message,true);return;}
  data=row.data||{};
  ["news","team","streamers","gallery"].forEach(k=>{ if(!Array.isArray(data[k])) data[k]=[]; });
  if(!data.planner) data.planner={label:"",month:"",eatOffset:3,slots:[],week:[]};
  theme(); applyTheme();
  document.getElementById("connNote").textContent="Connected — edits are drafts until you publish.";
  liveJSON=JSON.stringify(data); renderAll(); await restoreDraftIfAny();
}

/* ---------- drafts, publishing & confirmations ---------- */
const DRAFT_KEY="gtc_draft_v1";
let dirty=false, liveJSON="";
function toast(msg,isErr){const t=el("div","toast"+(isErr?" err":""),msg);document.getElementById("toasts").append(t);setTimeout(()=>t.remove(),isErr?6000:3000);}
function confirmBox(title,msg,okText,danger){return new Promise(res=>{const bg=el("div","modalbg"),m=el("div","modal");m.append(el("h3","",title),el("p","muted",msg));const a=el("div","item-actions"),c=el("button","","Cancel"),o=el("button",danger?"danger":"primary",okText);a.append(c,o);m.append(a);bg.append(m);document.body.append(bg);const done=v=>{bg.remove();res(v);};c.onclick=()=>done(false);o.onclick=()=>done(true);bg.onclick=e=>{if(e.target===bg)done(false);};});}
function setDirty(v){dirty=v;document.getElementById("publishBtn").disabled=!v;document.getElementById("discardBtn").disabled=!v;
  const s=document.getElementById("saveStatus");s.innerHTML="";s.style.color="";
  s.append(el("span","pill "+(v?"draft":"live"),v?"Draft":"Live"),document.createTextNode(v?"Unpublished changes — saved on this device. Click Publish to go live.":"Everything is published."));}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:Date.now(),data}));}catch(e){}setDirty(JSON.stringify(data)!==liveJSON);},250);}
async function doSave(){
  if(saving)return; saving=true; status("Publishing…");
  const {error}=await sb.from("site_content").update({data,updated_at:new Date().toISOString()}).eq("id",1);
  saving=false;
  if(error){status("Couldn't publish: "+error.message,true);toast("Publish failed: "+error.message,true);return;}
  liveJSON=JSON.stringify(data); localStorage.removeItem(DRAFT_KEY); setDirty(false); toast("Published — your site is updated.");
}

window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
async function restoreDraftIfAny(){
  let d=null;try{d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");}catch(e){}
  if(!d||JSON.stringify(d.data)===liveJSON){setDirty(false);return;}
  if(await confirmBox("Unpublished draft found","You have edits from "+new Date(d.at).toLocaleString()+" that weren't published. Continue with them?","Keep draft")){
    data=d.data;theme();applyTheme();renderAll();setDirty(true);}else{localStorage.removeItem(DRAFT_KEY);setDirty(false);}
}

/* ---------- image uploads ---------- */
async function uploadImage(file,onProgress){
  if(!file) return null;
  if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)) throw new Error("Please use a JPG, PNG, WebP or GIF image.");
  if(file.size>5*1024*1024) throw new Error("Image is over 5MB — please use a smaller one.");
  const safe=file.name.toLowerCase().replace(/[^a-z0-9.\-_]+/g,"-");
  const path=new Date().getFullYear()+"/"+Date.now()+"-"+safe;
  if(onProgress) onProgress("Uploading…");
  const up=await store.storage.from(STORAGE_BUCKET).upload(path,file,{cacheControl:"31536000",upsert:false});
  if(up.error) throw new Error(up.error.message);
  const sig=await store.storage.from(STORAGE_BUCKET).createSignedUrl(path,SIGNED_TTL);
  if(sig.error) throw new Error(sig.error.message);
  return {url:sig.data.signedUrl,path};
}

/* An image field: text box + upload/drop area + live thumbnail */
function imageField(labelText,getVal,setVal){
  const wrap=el("div","field imgwrap");
  wrap.append(el("label","",labelText));
  const input=textInput(getVal(),"Paste an image link, or upload below");
  const zone=el("div","dropzone","Click to choose an image, or drop one here");
  const file=document.createElement("input"); file.type="file"; file.accept="image/*"; file.hidden=true;
  const thumbRow=el("div","thumb");
  const img=document.createElement("img"); img.alt="";
  const info=el("span","muted","");
  const clear=el("button","tiny danger","Remove image");
  thumbRow.append(img,info,clear);

  function refresh(){
    const v=getVal();
    input.value=v||"";
    if(v){ img.src=v; thumbRow.hidden=false; } else { thumbRow.hidden=true; }
  }
  input.addEventListener("change",()=>{ setVal(input.value.trim()); refresh(); save(); });
  clear.addEventListener("click",()=>{ setVal(""); refresh(); save(); });
  img.addEventListener("error",()=>{ info.textContent="Couldn't load that image."; });
  img.addEventListener("load",()=>{ info.textContent=""; });

  async function handle(f){
    try{
      info.textContent="Uploading…"; zone.classList.remove("over");
      const res=await uploadImage(f,m=>info.textContent=m);
      setVal(res.url); refresh(); info.textContent="Uploaded."; save();
    }catch(e){ info.textContent=e.message; thumbRow.hidden=false; }
  }
  zone.addEventListener("click",()=>file.click());
  file.addEventListener("change",()=>{ if(file.files[0]) handle(file.files[0]); file.value=""; });
  ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove("over");}));
  zone.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) handle(f); });

  wrap.append(input,zone,file,thumbRow); refresh();
  return wrap;
}

function sRegion(pg,s){return s.region&&REGIONS[s.region]?s.region:(s.type==="builtin"&&s.key==="hero"?"header":"body");}
function sName(s){const B=BUILTIN[s.key];return s.type==="builtin"?(B?B.l:s.key):(s.title||TYPES[s.type]||s.type);}

async function lxEdit(pg,s){
  const S=data.site,snap=JSON.stringify(s),b=el("div");b.style.marginTop=".7rem";
  const vis=el("div","field check"),cb=document.createElement("input");cb.type="checkbox";cb.checked=s.enabled!==false;cb.id="lxv"+s.id;
  cb.onchange=()=>{s.enabled=cb.checked;save();};
  const lb=document.createElement("label");lb.htmlFor=cb.id;lb.textContent="Show on the site";vis.append(cb,lb);
  const holder=el("div"),ch=()=>{save();draw();};
  function draw(){holder.innerHTML="";holder.append(sectionBody(S,pg,s,ch));
    /* Custom HTML: roomy code box, Tab inserts spaces instead of leaving the field */
    const ta=holder.querySelector("textarea");
    if(s.type==="html"&&ta){ta.spellcheck=false;ta.style.minHeight="16em";ta.style.tabSize="2";
      ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const i=ta.selectionStart;ta.setRangeText("  ",i,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"));}});}}
  draw();
  const rm=el("button","danger tiny","Remove gadget"),ra=el("div","item-actions");ra.append(rm);b.append(vis,holder,ra);
  const bg=el("div","modalbg"),m=el("div","modal");m.style.maxWidth="680px";m.style.maxHeight="88vh";m.style.overflow="auto";
  const ac=el("div","item-actions"),cn=el("button","","Cancel"),sv=el("button","primary","Save");ac.append(cn,sv);
  m.append(el("h3","",sName(s)),b,ac);bg.append(m);document.body.append(bg);
  const ta0=holder.querySelector("textarea");if(ta0)ta0.focus();
  const close=()=>{document.removeEventListener("keydown",esc);bg.remove();renderPages();};
  const cancel=()=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,JSON.parse(snap));save();close();};
  const esc=e=>{if(e.key==="Escape"&&document.body.lastElementChild===bg)cancel();};
  document.addEventListener("keydown",esc);
  sv.onclick=()=>{save();toast("Gadget saved to your draft. Click Publish to go live.");close();};
  cn.onclick=cancel;
  rm.onclick=async()=>{if(await confirmBox("Remove "+sName(s)+"?","It disappears from the site once you publish.","Remove",true)){pg.sections.splice(pg.sections.indexOf(s),1);save();close();}};
}

  const bg=el("div","modalbg"),m=el("div","modal");m.append(el("h3","","Add a gadget"),el("p","muted","Choose what to place in “"+REGIONS[region][0]+"”."));

function lxGadget(pg,s){
  const g=el("div","lx-gadget"+(s.enabled===false?" off":""));g.draggable=!lxPreview;g.dataset.id=s.id;
  const eye=el("button","lx-eye");eye.title=s.enabled===false?"Hidden — click to show":"Visible — click to hide";eye.append(svgEl(s.enabled===false?ICON.eyeOff:ICON.eye));
  eye.onclick=e=>{e.stopPropagation();s.enabled=s.enabled===false;lxChanged();};
  const t=el("div","lx-t");t.append(el("b","",sName(s)),el("small","",sKind(s)));
  const ed=el("button","lx-edit");ed.title="Edit gadget";ed.setAttribute("aria-label","Edit "+sName(s));ed.append(svgEl(ICON.pencil));ed.onclick=()=>lxEdit(pg,s);
  g.append(svgEl(ICON.grip),eye,t,ed);
  g.addEventListener("click",e=>{if(lxPreview||e.target.closest("button"))return;lxEdit(pg,s);});
  g.addEventListener("dragstart",e=>{lxDrag=s.id;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",s.id);setTimeout(()=>g.classList.add("dragging"),0);});
  g.addEventListener("dragend",()=>{lxDrag=null;g.classList.remove("dragging");document.querySelectorAll(".lx-drop-line").forEach(n=>n.remove());document.querySelectorAll(".lx-zone.over").forEach(n=>n.classList.remove("over"));});
  return g;
}
function lxIndexAt(zone,y){const kids=[...zone.querySelectorAll(":scope>.lx-gadget:not(.dragging)")];
  for(let i=0;i<kids.length;i++){const r=kids[i].getBoundingClientRect();if(y<r.top+r.height/2)return i;}return kids.length;}
function lxZone(pg,region,map){
  const reg=el("div","lx-region"),zone=el("div","lx-zone");zone.dataset.region=region;
  reg.append(el("h4","",REGIONS[region][0]));
  const add=el("button","lx-add","+ Add a gadget");add.onclick=()=>lxAddGadget(pg,region);
  zone.append(add);
  if(region==="header"){const pin=el("div","lx-gadget pinned");const t=el("div","lx-t");t.append(el("b","",pg.header&&pg.header.title||"Page banner"),el("small","","Page banner · set in page settings"));const ed=el("button","lx-edit");ed.append(svgEl(ICON.pencil));ed.title="Edit banner";ed.onclick=()=>lxPageSettings(pg);pin.append(svgEl(ICON.grip),svgEl(ICON.eye),t,ed);zone.append(pin);}
  map[region].forEach(s=>zone.append(lxGadget(pg,s)));
  zone.addEventListener("dragover",e=>{if(!lxDrag)return;e.preventDefault();e.dataTransfer.dropEffect="move";zone.classList.add("over");
    zone.querySelectorAll(".lx-drop-line").forEach(n=>n.remove());
    const kids=[...zone.querySelectorAll(":scope>.lx-gadget:not(.dragging)")],i=lxIndexAt(zone,e.clientY),line=el("div","lx-drop-line");
    kids[i]?zone.insertBefore(line,kids[i]):zone.append(line);});
  zone.addEventListener("dragleave",e=>{if(!zone.contains(e.relatedTarget)){zone.classList.remove("over");zone.querySelectorAll(".lx-drop-line").forEach(n=>n.remove());}});
  zone.addEventListener("drop",e=>{e.preventDefault();if(!lxDrag)return;
    const m=lxMap(pg),id=lxDrag;let s=null;
    Object.values(m).forEach(a=>{const i=a.findIndex(x=>x.id===id);if(i>-1)s=a.splice(i,1)[0];});
    if(!s)return;const i=Math.min(lxIndexAt(zone,e.clientY),m[region].length);
    s.region=region;m[region].splice(i,0,s);lxFlatten(pg,m);lxChanged();});
  reg.append(zone);return reg;
}
function renderPages(){
  const p=document.getElementById("panePages");p.innerHTML="";
  if(!data.site){const c=el("div","card");c.append(el("h3","","Pages & sections"),el("p","muted","Your site is using its built-in layout. Load every default page and section into the layout editor to arrange, edit and hide them. Nothing changes on the live site until you publish."));
    const b=el("button","primary","Start customising");b.onclick=()=>{data.site=JSON.parse(JSON.stringify(DEFAULT_SITE));save();renderPages();};c.append(b);p.append(c);return;}
  const S=data.site;if(!lxSnap)lxSnap=JSON.stringify(S);
  if(!S.pages.some(x=>x.id===lxPage))lxPage=S.pages[0].id;
  const pg=S.pages.find(x=>x.id===lxPage),map=lxMap(pg);
  const bar=el("div","lx-pages");
  S.pages.forEach(x=>{const b=el("button","tab"+(x===pg?" active":""),x.title||x.slug);b.onclick=()=>{lxPage=x.id;renderPages();};bar.append(b);});
  const np=el("button","tiny","+ Add page");np.onclick=()=>{const id=uid();S.pages.push({id,slug:"page-"+id.slice(0,4),title:"New page",nav:true,header:{title:"New page",lead:""},sections:[]});lxPage=id;lxChanged();};
  const ps=el("button","tiny","Page settings");ps.onclick=()=>lxPageSettings(pg);
  bar.append(np,ps);p.append(bar);
  const grid=el("div","lx-grid"+(lxPreview?" lx-preview":""));
  const side=el("div","lx-col"),main=el("div","lx-col");
  side.append(lxZone(pg,"sbTop",map),lxZone(pg,"sbBottom",map));
  ["topbar","header","body","pagelist"].forEach(r=>main.append(lxZone(pg,r,map)));
  grid.append(side,main);
  const foot=lxZone(pg,"footer",map);foot.style.gridColumn="1 / -1";grid.append(foot);
  p.append(grid);
  const tb=el("div","lx-bar");tb.setAttribute("role","toolbar");
  const mk=(cls,icon,label,fn)=>{const b=el("button",cls);b.append(svgEl(icon),document.createTextNode(label));b.onclick=fn;return b;};
  tb.append(
    mk("",ICON.x,"Cancel",async()=>{if(lxSnap===JSON.stringify(S)){toast("No layout changes to cancel.");return;}
      if(await confirmBox("Cancel layout changes?","The layout goes back to how it was when you opened this tab.","Cancel changes",true)){data.site=JSON.parse(lxSnap);save();renderPages();}}),
    mk(lxPreview?"primary":"",ICON.eye,lxPreview?"Edit":"Preview",()=>{lxPreview=!lxPreview;renderPages();}),
    mk("primary",ICON.save,"Save",async()=>{lxSnap=JSON.stringify(data.site);save();document.getElementById("publishBtn").click();}));
  p.append(tb);
}

/* ---------- generic list editor ---------- */
function listEditor(container,collectionKey,fieldsDef,addLabel,emptyText,titleFn){
  container.innerHTML="";
  const addBtn=el("button","add","+ "+addLabel);
  addBtn.addEventListener("click",()=>{
    const blank={}; fieldsDef.forEach(f=>blank[f.key]=f.type==="checkbox"?false:"");
    data[collectionKey].push(blank); save(); renderList();
  });
  container.append(addBtn);
  const listWrap=el("div"); container.append(listWrap);
  function renderList(){
    listWrap.innerHTML="";
    const items=data[collectionKey];
    if(!items.length){ listWrap.append(el("div","empty",emptyText)); return; }
    items.forEach((item,idx)=>{
      const card=el("div","card");
      const heading=el("h3","",titleFn(item)); card.append(heading);
      const grid=el("div","row2");
      fieldsDef.forEach(f=>{
        if(f.type==="image"){ const w=imageField(f.label,()=>item[f.key],v=>{item[f.key]=v;heading.textContent=titleFn(item);}); grid.append(w); return; }
        if(f.type==="checkbox"){
          const wrap=el("div","field check");
          const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!item[f.key];
          const id=collectionKey+idx+f.key; cb.id=id;
          const lab=document.createElement("label"); lab.htmlFor=id; lab.textContent=f.label;
          cb.addEventListener("change",()=>{item[f.key]=cb.checked;save();});
          wrap.append(cb,lab); grid.append(wrap); return;
        }
        const input=f.type==="textarea"?textArea(item[f.key],f.placeholder):textInput(item[f.key],f.placeholder);
        input.addEventListener("change",()=>{item[f.key]=input.value;save();heading.textContent=titleFn(item);});
        const wrap=field(f.label,input);
        if(f.wide) wrap.style.gridColumn="1 / -1";
        grid.append(wrap);
      });
      card.append(grid);
      const actions=el("div","item-actions");
      const up=el("button","tiny","Move up"), down=el("button","tiny","Move down");
      up.disabled=idx===0; down.disabled=idx===items.length-1;
      up.addEventListener("click",()=>{[items[idx-1],items[idx]]=[items[idx],items[idx-1]];save();renderList();});
      down.addEventListener("click",()=>{[items[idx+1],items[idx]]=[items[idx],items[idx+1]];save();renderList();});
      const del=el("button","danger","Remove");
      del.addEventListener("click",()=>{items.splice(idx,1);save();renderList();});
      actions.append(up,down,del); card.append(actions);
      listWrap.append(card);
    });
  }
  renderList();
}

    const {data:list}=await store.storage.from(STORAGE_BUCKET).list(y,{limit:200,sortBy:{column:"created_at",order:"desc"}});
    for(const f of (list||[])){
      const sig=await store.storage.from(STORAGE_BUCKET).createSignedUrl(y+"/"+f.name,SIGNED_TTL);
      if(sig.error) continue;
      found++;
      const fig=document.createElement("figure");
      const img=document.createElement("img"); img.src=sig.data.signedUrl; img.alt=f.name;
      const b=el("button","tiny","Copy link");
      b.addEventListener("click",async()=>{ try{await navigator.clipboard.writeText(sig.data.signedUrl);b.textContent="Copied!";}catch(e){b.textContent="Copy failed";} setTimeout(()=>b.textContent="Copy link",1500); });
      fig.append(img,b); grid.append(fig);
    }
  }
  if(!found) grid.append(el("div","empty","No images uploaded yet."));
}

/* ---------- planner ---------- */
function renderPlanner(){
  const p=document.getElementById("panePlanner"); p.innerHTML="";
  const P=data.planner;
  const top=el("div","card"); top.append(el("h3","Month settings"));
  const grid=el("div","row3");
  const label=textInput(P.label), month=textInput(P.month,"YYYY-MM");
  const off=textInput(String(P.eatOffset)), slots=textInput((P.slots||[]).join(","),"18,20,22");
  label.addEventListener("change",()=>{P.label=label.value;save();});
  month.addEventListener("change",()=>{P.month=month.value;save();});
  off.addEventListener("change",()=>{P.eatOffset=Number(off.value)||0;save();});
  slots.addEventListener("change",()=>{P.slots=slots.value.split(",").map(s=>Number(s.trim())).filter(n=>!isNaN(n));save();});
  grid.append(field("Label shown to visitors",label),field("Planner month",month),field("EAT UTC offset",off));
  top.append(grid,field("Convoy start hours in EAT (comma-separated)",slots));
  p.append(top);
  const p2=el("div","card");
  p2.append(el("h3","Weekly schedule"),el("p","muted","Each day's convoys as [Game, Map name, TruckersMP?]."));
  (P.week||[]).forEach(day=>{
    const wrap=el("div"); wrap.style.marginBottom=".7rem";
    wrap.append(el("label","",day.day));
    const ta=textArea(JSON.stringify(day.convoys)); ta.style.minHeight="3em";
    ta.addEventListener("change",()=>{
      try{ day.convoys=JSON.parse(ta.value); ta.style.borderColor=""; save(); }
      catch(e){ ta.style.borderColor="var(--danger)"; }
    });
    wrap.append(ta); p2.append(wrap);
  });
  p.append(p2);
}

/* ---------- backup ---------- */
function renderBackup(){
  const p=document.getElementById("paneBackup"); p.innerHTML="";
  p.append(el("p","muted","A snapshot of everything currently live, in case you want to save a copy."));
  const bar=el("div"); const copyBtn=el("button","primary","Copy JSON"); bar.append(copyBtn); p.append(bar);
  const pre=document.createElement("pre"); const text=JSON.stringify(data,null,2); pre.textContent=text; p.append(pre);
  copyBtn.addEventListener("click",async()=>{
    try{ await navigator.clipboard.writeText(text); copyBtn.textContent="Copied!"; }
    catch(e){ copyBtn.textContent="Select the text below"; }
    setTimeout(()=>copyBtn.textContent="Copy JSON",1800);
  });
}

function renderAll(){ renderLinks(); renderPages(); renderDesign(); renderNews(); renderTeam(); renderStreamers(); renderGallery(); renderPlanner(); }

/* resume session if already signed in */
(async()=>{ const {data:sess}=await sb.auth.getSession(); if(sess&&sess.session) boot(); })();
</script>
